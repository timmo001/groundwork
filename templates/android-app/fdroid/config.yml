---
# The F-Droid repository the release publishes to GitHub Pages, signed with
# the same key as the APK. Every secret comes from the environment, so this
# file holds none. Change repo_url and the names for your app.
repo_url: https://timmo.dev/groundwork/fdroid/repo
repo_name: Groundwork
repo_description: Apps built on Groundwork, signed by their author.
repo_keyalias:
  env: ANDROID_KEY_ALIAS
keystore:
  env: ANDROID_KEYSTORE_FILE
keystorepass:
  env: ANDROID_KEYSTORE_PASSWORD
keypass:
  env: ANDROID_KEY_PASSWORD
