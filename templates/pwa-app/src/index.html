<!doctype html>
<!-- The demo page: the theme CSS and the demo app, installable as a PWA. -->
<html lang="en" data-gw-theme="base">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Updates</title>
    <!-- pwa:head -->
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <gw-app-bar>
      <span slot="brand" class="brand">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect x="20" y="13" width="24" height="9" rx="2" opacity="0.5" />
          <rect x="12" y="27.5" width="40" height="9" rx="2" opacity="0.75" />
          <rect x="4" y="42" width="56" height="9" rx="2" />
        </svg>
        Groundwork
      </span>
      <gw-theme-picker slot="actions"></gw-theme-picker>
    </gw-app-bar>
    <main>
      <gw-demo-app></gw-demo-app>
      <gw-card
        id="phone"
        heading="This phone"
        description="What the installed app adds to the page"
      >
        <gw-facts></gw-facts>
        <div class="phone-actions" hidden>
          <gw-button class="install" appearance="outlined" size="small"
            >Install the app</gw-button
          >
        </div>
      </gw-card>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
