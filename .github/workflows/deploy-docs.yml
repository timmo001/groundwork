---
# Deploys the prod stage of the docs site's Alchemy stack in docs/alchemy.run.ts
# from main: the groundwork-docs Worker at groundwork.timmo.dev. The Cloudflare
# token comes from docs/stacks/github.ts.
name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-docs.yml
      - bun.lock
      - docs/**
      - mise.toml
      - package.json
      - packages/**
  workflow_dispatch: {}

# Deploys queue rather than cancel, so a stack update never stops halfway
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Blume reads last-modified dates from git
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566
        with:
          install_args: bun node

      - name: Build and deploy
        run: mise run docs:deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
