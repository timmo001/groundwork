---
# Builds the Android demo template, so the Kotlin shell in packages/mobile and
# the app around it keep building with the pinned SDK, JDK and Gradle.
name: Android

on:
  pull_request:
    paths:
      - .github/workflows/android.yml
      - bun.lock
      - mise.toml
      - packages/**
      - templates/android-app/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/android.yml
      - bun.lock
      - mise.toml
      - packages/**
      - templates/android-app/**
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566

      - name: Install the SDK packages
        run: android --no-metrics sdk install platform-tools "platforms/$ANDROID_API" build-tools/37.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: mise run android:build

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-demo
          path: templates/android-app/android/app/build/outputs/apk/
          if-no-files-found: error
