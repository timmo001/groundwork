---
# Builds the Android demo template, so the Kotlin shell in packages/mobile and
# the app around it keep building with the pinned SDK, JDK and Gradle. On a
# published release it signs the APK, attaches it to the release, and rebuilds
# the F-Droid repository on the fdroid branch from every release's APK.
name: Android

on:
  release:
    types:
      - published
  pull_request:
    paths:
      - .github/workflows/android.yml
      - bun.lock
      - mise.toml
      - packages/**
      - templates/android-app/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/android.yml
      - bun.lock
      - mise.toml
      - packages/**
      - templates/android-app/**
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566

      - name: Install the SDK packages
        run: android --no-metrics sdk install platform-tools "platforms/$ANDROID_API" build-tools/37.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: mise run android:build

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-demo
          path: templates/android-app/android/app/build/outputs/apk/
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      APP_VERSION: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Write the signing key
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret, so no signed APK or F-Droid repository for this release"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.key.outputs.signed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        if: steps.key.outputs.signed == 'true'
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566

      - name: Install the SDK packages
        if: steps.key.outputs.signed == 'true'
        run: android --no-metrics sdk install platform-tools "platforms/$ANDROID_API" build-tools/37.0.0

      - name: Install dependencies
        if: steps.key.outputs.signed == 'true'
        run: bun install --frozen-lockfile

      - name: Build the signed APK
        if: steps.key.outputs.signed == 'true'
        run: mise run android:build

      - name: Attach the APK to the release
        if: steps.key.outputs.signed == 'true'
        run: |
          cp templates/android-app/android/app/build/outputs/apk/release/app-release.apk "groundwork-demo-$TAG.apk"
          gh release upload "$TAG" "groundwork-demo-$TAG.apk" --clobber

      - name: Build the F-Droid repository
        if: steps.key.outputs.signed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/fdroid/repo"
          cp -r templates/android-app/fdroid/. "$RUNNER_TEMP/fdroid/"
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --pattern 'groundwork-demo-*.apk' --dir "$RUNNER_TEMP/fdroid/repo" || true
          done
          cd "$RUNNER_TEMP/fdroid"
          chmod 600 config.yml
          fdroid update --pretty
          rm -f config.yml
          rm -rf metadata tmp

      # The fdroid branch holds one commit, replaced each release, so old
      # APKs don't pile up in the history.
      - name: Publish the F-Droid repository
        if: steps.key.outputs.signed == 'true'
        working-directory: ${{ runner.temp }}/fdroid
        run: |
          git init -q -b fdroid
          git add -A
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "F-Droid repository for $TAG"
          git push -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" fdroid
