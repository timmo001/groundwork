---
# Builds the Android demo template, so the Kotlin shell in packages/mobile and
# the app around it keep building with the pinned SDK, JDK and Gradle. On a
# published release the shared publish-android-release workflow signs the APK,
# attaches it to the release, and rebuilds the shared F-Droid repository on R2
# with it.
name: Android

on:
  release:
    types:
      - published
  pull_request:
    paths:
      - .github/workflows/android.yml
      - bun.lock
      - mise.toml
      - packages/**
      - templates/android-app/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/android.yml
      - bun.lock
      - mise.toml
      - packages/**
      - templates/android-app/**
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Publish the Android demo for this existing release, such as one whose Android job failed"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-android.yml@36ba6651f1296cce685ede8ac38b9574c9291028 # master
    with:
      setup-command: |
        android --no-metrics sdk install platform-tools "platforms/$ANDROID_API" build-tools/37.0.0
        bun install --frozen-lockfile
      build-command: mise run android:build
      apk-directory: templates/android-app/android/app/build/outputs/apk/
      artifact-name: android-demo

  # Each published release, or a release tag given by hand to publish one
  # again, such as one whose release job failed
  release:
    name: Release
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.release-tag != '')
    permissions:
      contents: write
    uses: timmo001/workflows/.github/workflows/publish-android-release.yml@fa479eabebf26cc5f655b165c20423fb8fcc0cf4 # 20261115.0
    with:
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
      setup-command: |
        android --no-metrics sdk install platform-tools "platforms/$ANDROID_API" build-tools/37.0.0
        bun install --frozen-lockfile
      build-command: mise run android:build
      apk-path: templates/android-app/android/app/build/outputs/apk/release/app-release.apk
      asset-name: groundwork-demo
      fdroid-directory: templates/android-app/fdroid
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
