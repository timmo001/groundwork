---
# Builds the Android demo template, so the Kotlin shell in packages/mobile and
# the app around it keep building with the pinned SDK, JDK and Gradle. On a
# published release the shared publish-android-release workflow signs the APK,
# attaches it to the release, and rebuilds the shared F-Droid repository on R2
# with it.
name: Android

on:
  release:
    types:
      - published
  pull_request:
    paths:
      - .github/workflows/android.yml
      - bun.lock
      - mise.toml
      - packages/**
      - templates/android-app/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/android.yml
      - bun.lock
      - mise.toml
      - packages/**
      - templates/android-app/**
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Publish the Android demo for this existing release, such as one whose Android job failed"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566

      - name: Install the SDK packages
        run: android --no-metrics sdk install platform-tools "platforms/$ANDROID_API" build-tools/37.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: mise run android:build

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-demo
          path: templates/android-app/android/app/build/outputs/apk/
          if-no-files-found: error

  # Each published release, or a release tag given by hand to publish one
  # again, such as one whose release job failed
  release:
    name: Release
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.release-tag != '')
    permissions:
      contents: write
    uses: timmo001/workflows/.github/workflows/publish-android-release.yml@13dce11f125107b83ea662167f1091d070dcd359 # 20261114.0
    with:
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
      setup-command: |
        android --no-metrics sdk install platform-tools "platforms/$ANDROID_API" build-tools/37.0.0
        bun install --frozen-lockfile
      build-command: mise run android:build
      apk-path: templates/android-app/android/app/build/outputs/apk/release/app-release.apk
      asset-name: groundwork-demo
      fdroid-directory: templates/android-app/fdroid
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
