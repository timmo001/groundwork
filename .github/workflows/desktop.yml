---
# Builds the desktop demo template on Linux, macOS and Windows, so the
# Electrobun app and @timmo001/groundwork-desktop keep building everywhere.
name: Desktop

on:
  pull_request:
    paths:
      - .github/workflows/desktop.yml
      - bun.lock
      - packages/**
      - templates/desktop-app/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/desktop.yml
      - bun.lock
      - packages/**
      - templates/desktop-app/**
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: templates/desktop-app
        run: bun run build

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-demo-${{ runner.os }}
          path: templates/desktop-app/artifacts/
          if-no-files-found: error
