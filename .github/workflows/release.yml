---
# Publishes @timmo001/groundwork-tokens, -ui, -tui, -report, -pwa and -mobile
# to npm, and @timmo001/docs-kit to npm and JSR, when a GitHub release is
# published, with the tool versions mise pins. All share one version, the
# release tag.
name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  tools:
    name: Resolve release tools
    runs-on: ubuntu-latest
    outputs:
      bun: ${{ steps.versions.outputs.bun }}
      node: ${{ steps.versions.outputs.node }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566

      - name: Read tool versions
        id: versions
        run: |
          printf 'bun=%s\n' "$(mise current bun)" >> "$GITHUB_OUTPUT"
          printf 'node=%s\n' "$(mise current node)" >> "$GITHUB_OUTPUT"

  npm-tokens:
    needs: tools
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-npm-package.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      node-version: ${{ needs.tools.outputs.node }}
      package-path: packages/tokens
      build-command: "true"

  npm-ui:
    needs: tools
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-npm-package.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      node-version: ${{ needs.tools.outputs.node }}
      package-path: packages/ui
      build-command: "true"

  # tui depends on tokens at the same version, so it waits for it
  npm-tui:
    needs:
      - tools
      - npm-tokens
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-npm-package.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      node-version: ${{ needs.tools.outputs.node }}
      package-path: packages/tui
      build-command: "true"

  # report depends on tokens and ui at the same version, so it waits for them
  npm-report:
    needs:
      - tools
      - npm-tokens
      - npm-ui
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-npm-package.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      node-version: ${{ needs.tools.outputs.node }}
      package-path: packages/report
      build-command: "true"

  # pwa depends on tokens at the same version, so it waits for it
  npm-pwa:
    needs:
      - tools
      - npm-tokens
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-npm-package.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      node-version: ${{ needs.tools.outputs.node }}
      package-path: packages/pwa
      build-command: "true"

  # mobile depends on pwa and tokens at the same version, so it waits for pwa
  npm-mobile:
    needs:
      - tools
      - npm-pwa
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-npm-package.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      node-version: ${{ needs.tools.outputs.node }}
      package-path: packages/mobile
      build-command: "true"

  # docs-kit depends on ui and tokens at the same version, so it waits for
  # them to reach npm before publishing anywhere
  npm:
    needs:
      - tools
      - npm-tokens
      - npm-ui
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-npm-package.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      node-version: ${{ needs.tools.outputs.node }}
      package-path: packages/docs-kit
      build-command: "true"

  jsr:
    needs:
      - tools
      - npm-tokens
      - npm-ui
    permissions:
      contents: read
      id-token: write
    uses: timmo001/workflows/.github/workflows/publish-jsr-package.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0
    with:
      bun-version: ${{ needs.tools.outputs.bun }}
      package-path: packages/docs-kit
