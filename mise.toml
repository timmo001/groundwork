# Groundwork's pinned tools and tasks: install, lint, format, generate, check,
# the docs server and build, the sync, and the docs-kit rollout. CI runs check;
# the hk pre-push hook runs only lint.
min_version = "2025.1.0"

[tools]
node = "26.13.0"
bun = "1.4.4"
# The linters the shared hk pre-push hook runs, matching CI.
uv = "0.13.7"
# yamllint's PyYAML has no wheels for newer Pythons, and mise won't build it from source.
python = "3.15.2"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
# The Android shell: the SDK command-line tools, and the JDK, Gradle and Kotlin
# that build it. android:setup installs the SDK packages and the emulator.
android-sdk = "23.0"
java = "temurin-25.0.5+8.0.LTS"
gradle = "9.9.0"
kotlin = "2.4.21"
# Builds and signs the F-Droid repository the Android release publishes, and
# syncs it with its R2 bucket.
"pipx:fdroidserver" = "2.4.5"
# R2 speaks the S3 API, so aws s3 sync moves the repository in and out of the
# bucket. It never talks to AWS itself.
"pipx:awscli" = "1.46.3"

[env]
ANDROID_AVD = "groundwork"
ANDROID_API = "android-37.2"

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Lint every package, template and the docs site with the shared Oxlint rules"
depends = ["install"]
run = "bun run --filter './packages/*' --filter './templates/*' --filter './docs' lint"

[tasks.typecheck]
description = "Type-check every package"
depends = ["install"]
run = "bun run --filter './packages/*' --filter './templates/*' typecheck"

[tasks.format]
description = "Format every package"
depends = ["install"]
run = "bun run --filter './packages/*' --filter './templates/*' format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run --filter './packages/*' --filter './templates/*' format:check"

[tasks.gen]
description = "Generate every token target, the conventions data and the generated docs pages"
depends = ["install"]
run = [
  "bun run --cwd packages/tokens gen",
  "bun run --cwd packages/conventions gen",
  "bun run --cwd packages/ui gen",
]

[tasks."gen:check"]
description = "Check generated files match the theme documents, conventions and element docstrings, and that each define/ entry defines what its element renders"
depends = ["install"]
run = [
  "bun run --cwd packages/tokens gen:check",
  "bun run --cwd packages/conventions gen:check",
  "bun run --cwd packages/ui gen:check",
]

[tasks.conventions]
description = "Check the label sets, repository kinds and repository files"
depends = ["install"]
dir = "packages/conventions"
run = "bun run check"

[tasks.contrast]
description = "Check every core theme meets its contrast targets"
depends = ["install"]
dir = "packages/tokens"
run = "bun run contrast"

[tasks."docs:dev"]
description = "Run the docs dev server"
depends = ["install"]
dir = "docs"
# A reused Vite cache makes every page fail to resolve Astro's ClientRouter script
run = ["rm -rf .blume/.cache/vite", "bun run dev"]

[tasks."docs:build"]
description = "Build the docs site"
depends = ["install"]
dir = "docs"
run = "bun run build"

[tasks."docs:preview"]
description = "Preview the built docs site"
dir = "docs"
run = "bun run preview"

[tasks."serve:docs"]
description = "Start the docs dev server in the background through Pitchfork"
run = "pitchfork start docs"

[tasks."demo:web"]
description = "Run the web demo: the docs dev server, with the demo at /templates/app"
depends = ["serve:docs"]
run = "echo 'The web demo is at https://docs.groundwork.localhost/templates/app'"

[tasks."demo:cli"]
description = "Run the CLI demo; pass a command after --, such as status"
depends = ["install"]
dir = "templates/cli-tool"
run = "bun run src/cli.ts"

[tasks."demo:tui"]
description = "Run the TUI demo; GW_THEME and GW_MODE pick its theme"
depends = ["install"]
dir = "templates/tui-menu"
run = "bun run src/index.ts"

[tasks."demo:desktop"]
description = "Run the desktop demo: the demo app in an Electrobun window"
depends = ["install"]
dir = "templates/desktop-app"
run = "bun run start"

[tasks."pwa:start"]
description = "Build the PWA template and serve it on 127.0.0.1"
depends = ["install"]
dir = "templates/pwa-app"
run = "bun run start"

[tasks."demo:pwa"]
description = "Serve the PWA demo in the background through Pitchfork, and to the emulator when one is running"
run = '''
pitchfork start pwa
port=$(pitchfork list --project --json | jq -r '.[] | select(.name == "pwa") | .active_port')
if adb get-state >/dev/null 2>&1; then
  adb reverse "tcp:$port" "tcp:$port" >/dev/null
  echo "The emulator reaches it at http://localhost:$port/"
fi
echo "The PWA demo is at https://pwa.groundwork.localhost"
'''

[tasks."demo:android"]
description = "Build the Android demo, the demo app in the Kotlin shell, and install and open it on the running emulator"
depends = ["install"]
dir = "templates/android-app"
run = '''
bun run build
(cd android && gradle --no-daemon -q --console=plain :app:installDebug)
adb shell am start -S -n dev.timmo.groundwork.demo/.MainActivity >/dev/null
echo "The Android demo is open on the emulator"
'''

[tasks."android:build"]
description = "Build the Android demo's web page and its debug and release APKs"
depends = ["install"]
dir = "templates/android-app"
run = '''
bun run build
(cd android && gradle --no-daemon -q --console=plain :app:assembleDebug :app:assembleRelease)
'''

[tasks."android:setup"]
description = "Install the Android SDK packages and create the groundwork emulator, a medium phone on the latest Android"
run = '''
abi=x86_64
[ "$(uname -m)" = aarch64 ] && abi=arm64-v8a
image="system-images/$ANDROID_API/google_apis_playstore_ps16k/$abi"
android --no-metrics sdk install platform-tools emulator "platforms/$ANDROID_API" build-tools/37.0.0 "$image"
avdmanager list avd -c | grep -qx "$ANDROID_AVD" ||
  echo no | avdmanager create avd --name "$ANDROID_AVD" --device medium_phone --package "$(echo "$image" | tr / ';')"
'''

[tasks."android:emulator"]
description = "Start the groundwork emulator in the background, in dark mode, waiting until it has booted"
depends = ["android:setup"]
run = '''
# Hyprland leaves Xwayland apps unscaled (force_zero_scaling), so the Qt
# emulator needs the monitor's scale itself.
scale=$(hyprctl -j monitors 2>/dev/null | jq -r 'first(.[] | select(.focused)) | .scale' 2>/dev/null)
QT_SCALE_FACTOR=${scale:-1} emulator -avd "$ANDROID_AVD" -no-snapshot-save -no-boot-anim > /dev/null 2>&1 &
adb wait-for-device
until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do sleep 2; done
adb shell cmd uimode night yes >/dev/null
echo "$ANDROID_AVD is up: $(adb shell getprop ro.build.version.release | tr -d '\r') (API $(adb shell getprop ro.build.version.sdk | tr -d '\r'))"
'''

[tasks."report:dev"]
description = "Run the report template's dev server, which reloads the sample report on a change"
depends = ["install"]
dir = "templates/report"
run = "bun run dev"

[tasks."report:build"]
description = "Write the report template's sample report to templates/report/dist/report.html"
depends = ["install"]
dir = "templates/report"
run = "bun run build"

[tasks."serve:report"]
description = "Start the report template's dev server in the background through Pitchfork"
run = "pitchfork start report"

[tasks."demo:panel"]
description = "Publish the Omarchy panel demo to the bar through Pitchfork; stop it with pitchfork stop panel"
run = "pitchfork start panel"

[tasks."serve:docs:status"]
description = "Show the background docs dev server status"
run = "pitchfork status docs"

[tasks."serve:docs:logs"]
description = "Follow the background docs dev server logs"
run = "pitchfork logs -t docs"

[tasks."serve:docs:restart"]
description = "Restart the background docs dev server"
run = "pitchfork restart docs"

[tasks."serve:docs:stop"]
description = "Stop the background docs dev server"
run = "pitchfork stop docs"

[tasks.sync]
description = "Carry QML edits back from the apps, then copy changed items out to them"
depends = ["install"]
run = "bun run packages/sync/src/cli.ts run"

[tasks."sync:check"]
description = "List what a sync would change without changing anything"
run = "bun run packages/sync/src/cli.ts run --check"

[tasks."sync:status"]
description = "Show where every app's copies stand"
run = "bun run packages/sync/src/cli.ts status"

[tasks.test]
description = "Run the tests next to code that computes"
depends = ["install"]
run = "bun test packages"

[tasks.capture]
description = "Screenshot every docs page on several themes, to look through after a large change"
depends = ["install"]
dir = "docs"
run = "bun run capture"

[tasks.frame]
description = "Wrap a desktop or terminal screenshot in a window frame for the docs"
depends = ["install"]
dir = "docs"
run = "bun scripts/frame.ts"

[tasks."docs:check"]
description = "Check the docs site's pages, links and types without disturbing a running dev server"
depends = ["install"]
dir = "docs"
# The tsconfig reads Blume's generated types from .blume/. When it exists a dev
# server may be using it, so check in --isolated's .blume-verify/ and keep
# reading those types; in a fresh checkout such as CI, generate .blume/ itself.
run = "if [ -d .blume ]; then bun run check -- --isolated; else bun run check; fi"

[tasks.check]
description = "Lint, type-check, test, verify formatting, generated files, contrast, conventions and the docs site"
depends = [
  "lint",
  "typecheck",
  "test",
  "format:check",
  "gen:check",
  "contrast",
  "conventions",
  "docs:check",
]
